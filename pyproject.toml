[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "china-pension-strategy"
version = "0.1.2"
description = "Deterministic Chinese pension contribution and retirement strategy analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [
    {name = "Alaric1098"},
]
keywords = [
    "china",
    "pension",
    "retirement",
    "social-insurance",
    "policy-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23",
]

[project.urls]
Homepage = "https://github.com/Alaric1098/China-Pension-Strategy-Skill"
Repository = "https://github.com/Alaric1098/China-Pension-Strategy-Skill"

[project.scripts]
china-pension = "china_pension_strategy.entrypoints.cli.main:main"

[project.optional-dependencies]
test = [
    "hypothesis>=6.108",
    "pytest>=8.3",
]
quality = [
    "mypy==2.3.1",
    "ruff==0.16.3",
    "types-jsonschema==4.26.0.20260518",
]
release = [
    "build==1.5.0",
    "cyclonedx-bom==7.3.1",
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
