name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned toolchain
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install -e ".[test,quality,release]"

      - name: Quality gates
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src/china_pension_strategy

      - name: Prepare evidence directory
        run: mkdir -p release-evidence

      - name: Tests
        run: python -m pytest -q 2>&1 | tee release-evidence/test-summary.txt

      - name: Dependency vulnerabilities
        run: pip-audit

      - name: License inventory
        run: |
          pip-licenses --format=json --with-system > release-evidence/licenses.json
          python - <<'PY'
          import json
          import sys

          allowed = {
              "MIT",
              "MIT License",
              "Apache Software License",
              "Apache-2.0",
              "Apache-2.0 OR BSD-2-Clause",
              "Apache Software License; BSD License",
              "BSD License",
              "BSD-3-Clause",
              "BSD-2-Clause",
              "Mozilla Public License 2.0 (MPL 2.0)",
              "MPL-2.0",
              "ISC License (ISCL)",
              "Python Software Foundation License",
              "PSF-2.0",
              "GNU Lesser General Public License v2 or later (LGPLv2+)",
          }
          deps = json.load(open("release-evidence/licenses.json"))
          bad = [(d.get("Name"), d.get("License")) for d in deps if d.get("License") not in allowed]
          if bad:
              print("unacceptable licenses:", bad)
              sys.exit(1)
          PY

      - name: Detect secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline >/dev/null 2>&1
          detect-secrets scan --exclude-files '\.secrets\.baseline' > "$RUNNER_TEMP/secrets.json"
          python - "$RUNNER_TEMP/secrets.json" <<'PY'
          import json
          import pathlib
          import sys

          baseline = json.loads(pathlib.Path(".secrets.baseline").read_text())
          known = {
              (pathlib.Path(f).as_posix(), x["hashed_secret"])
              for f, xs in baseline["results"].items()
              for x in xs
          }
          scan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          new = [
              (pathlib.Path(f).as_posix(), x["type"])
              for f, xs in scan["results"].items()
              for x in xs
              if (pathlib.Path(f).as_posix(), x["hashed_secret"]) not in known
          ]
          if new:
              print("unaudited secrets:", new)
              sys.exit(1)
          PY

      - name: SBOM and dependency lock
        run: |
          pip freeze > release-evidence/dependencies.txt
          cyclonedx-py --format json --output release-evidence/sbom.json

      - name: Build
        run: python -m build

      - name: Checksums
        run: |
          (cd dist && sha256sum * > ../release-evidence/SHA256SUMS)

      - name: Install, upgrade, rollback, and replay
        run: |
          python -m venv /tmp/replay-venv
          /tmp/replay-venv/bin/python -m pip install --quiet --upgrade pip
          git worktree add --detach /tmp/v011 034bdf65a7269f077ff8287547138fbac9560008
          /tmp/replay-venv/bin/python -m pip install --quiet /tmp/v011
          golden() {
            /tmp/replay-venv/bin/china-pension analyze \
              --input evals/fixtures/golden-beijing-flex-2026.json \
              --runs-dir "$1" |
              python -c "import json,sys; print(json.load(sys.stdin)['data']['run_id'])"
          }
          ID1=$(golden /tmp/runs-v011)
          /tmp/replay-venv/bin/python -m pip install --quiet --force-reinstall dist/china_pension_strategy-*.whl
          ID2=$(golden /tmp/runs-v012)
          /tmp/replay-venv/bin/python -m pip install --quiet --force-reinstall /tmp/v011
          ID3=$(golden /tmp/runs-v011b)
          printf "v0.1.1=%s\nv0.1.2=%s\nrollback=%s\n" "$ID1" "$ID2" "$ID3" \
            | tee release-evidence/install-upgrade-rollback-replay.txt
          test "$ID1" = "$ID2" -a "$ID2" = "$ID3"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist
            release-evidence

      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* release-evidence/* \
            --prerelease \
            --verify-tag \
            --notes-file docs/releases/v0.1.2.md