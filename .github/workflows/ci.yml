name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify design documentation
        run: python verify_design_docs.py

      - name: Verify design contracts
        run: python test_design_contracts.py

      - name: Audit architecture
        run: python audit_architecture.py --gaps

      - name: Report policy expiry
        if: matrix.python-version == '3.13'
        continue-on-error: true
        run: python scripts/policy_expiry_report.py --horizon-months 6
